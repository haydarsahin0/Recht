<style>
/* Layout: eine ruhige Lernspalte – Kopf mit Level, darunter Karten/Quiz als Bühne, wie das Klausurtraining-PDF */
:root {

}

:root[data-theme="dark"] {
  --bg: #13110d; --surface: #1c1914; --ink: #f0e9dc; --ink2: #d8cfbf; --muted: #9d927f; --line: #3a342a;
  --gold: #c9a25e; --gold-ink: #e2c286; --gold-soft: #2a2419; --on-gold: #16140f;
  --ok: #92b882; --ok-soft: #1e2a1a; --no: #e39a84; --no-soft: #36211a;
  --stage: #0b0a08; --stage-ink: #f2ece0; --stage-muted: #a99f8c; --stage-line: rgba(201,162,94,.3);

* { box-sizing: border-box; }

.app { max-width: 760px; margin: 0 auto; padding-inline: 18px; padding-block: 18px 40px; }

.label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.muted { color: var(--muted); }

/* Kopf */

/* Bühne (dunkle Heldenkarte) */

/* Lern-Bildschirm */

.back { background: none; border: 1px solid var(--line); border-radius: 30px; padding: 6px 13px 5px; font-size: 13px; color: var(--muted); }

.card .q { font-family: var(--display); font-size: clamp(24px, 5vw, 30px); line-height: 1.2; color: var(--ink); margin-top: 8px; }

.boxes { display: flex; gap: 4px; }

.btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }

.btn.no { border-color: var(--no); color: var(--no); }
.btn.mid { border-color: var(--gold); color: var(--gold-ink); }
.btn.ok { border-color: var(--ok); color: var(--ok); }
.btn small { display: block; font-size: 11px; opacity: .8; margin-top: 2px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 13px 14px 12px; font-size: 16px; color: var(--ink); display: grid; grid-template-columns: 26px 1fr; gap: 8px; }

.fb { margin-top: 16px; border-radius: 10px; padding: 14px 16px; }
.fb.right { background: var(--ok-soft); border: 1px solid var(--ok); }

.pop { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); font-family: var(--display); font-size: 44px; font-weight: 600; color: var(--gold); pointer-events: none; animation: pop 900ms ease-out forwards; z-index: 30; }

.medal { width: 86px; height: 86px; margin: 6px auto 0; display: block; }

.overlay { position: fixed; inset: 0; background: rgba(10,9,7,.72); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 40; }

/* ───────── Zustand ───────── */
const KEY = "zivilrecht-drill-v1";
const RANKS = ["Rechts-Neuling","Paragrafen-Scout","Gutachten-Lehrling","Anspruchs-Jäger","Gutachten-Profi","Klausur-Maschine"];
const INTERVAL_DAYS = [0, 0.25, 1, 2, 4, 7];
const LEVEL_XP = 150;
const fresh = () => ({ v: 1, xp: 0, days: [], cards: {}, quiz: {}, write: {}, rounds: [], updatedAt: 0 });
let S = fresh();
let db = null, docRef = null, saving = false, dirty = false, saveTimer = null;

function loadLocal() { try { const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; } catch { return null; } }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
const today = () => new Date().toISOString().slice(0, 10);

function touch() {
  S.updatedAt = Date.now();
  const d = today();
  if (!S.days.includes(d)) { S.days.push(d); if (S.days.length > 60) S.days = S.days.slice(-60); }
  saveLocal(); scheduleSave(); renderTop();
}
function scheduleSave() { if (!docRef) return; dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200); }
async function flush() {
  if (!docRef || saving || !dirty) return;
  saving = true; dirty = false;
  try { await docRef.set(JSON.parse(JSON.stringify(S))); setSync(true); }
  catch (e) { setSync(false, e && e.code === "quota_exceeded" ? "Speicher voll – nur auf diesem Gerät" : "Nur auf diesem Gerät gespeichert"); }
  saving = false;
  if (dirty) scheduleSave();
}
function setSync(on, msg) {
  document.getElementById("sync").innerHTML = `<i class="dot${on ? " on" : ""}"></i>` + esc(msg || (on ? "Fortschritt in deinem Konto gespeichert" : "Fortschritt nur auf diesem Gerät"));
}

/* ───────── Hilfen ───────── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const level = () => Math.floor(S.xp / LEVEL_XP) + 1;
const rankName = l => RANKS[Math.min(l - 1, RANKS.length - 1)] + (l > RANKS.length ? " " + (l - RANKS.length + 1) : "");
function streak() {
  const set = new Set(S.days); let n = 0; const d = new Date();
  if (!set.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
  while (set.has(d.toISOString().slice(0, 10))) { n++; d.setDate(d.getDate() - 1); }

const cardState = id => S.cards[id] || { box: 0, due: 0, right: 0, wrong: 0 };

const mastered = () => CARDS.filter(c => cardState(c.id).box >= 4).length;
function accuracy(topic) {
  let r = 0, w = 0;

  CARDS.filter(c => !topic || c.topic === topic).forEach(c => { const s = S.cards[c.id]; if (s) { r += s.right; w += s.wrong; } });
  return r + w ? Math.round((r / (r + w)) * 100) : null;
}
const weakItems = () => QUIZ.filter(q => { const s = S.quiz[q.id]; return s && s.last === 0; });

function addXP(n) {

let deck = [], di = 0, deckLen = 0;
function startCards() {
  const due = dueCards().sort((a, b) => cardState(a.id).box - cardState(b.id).box);
  deck = (due.length ? due : shuffle(CARDS)).slice(0, 15); di = 0; deckLen = deck.length;
  showCard(false);
}
function showCard(open) {
  if (di >= deck.length) return finishCards();
  const c = deck[di], st = cardState(c.id);
  const boxes = [1, 2, 3, 4, 5].map(i => `<i class="${st.box >= i ? "on" : ""}"></i>`).join("");
  view.innerHTML = `
    <div class="bar2"><button class="back" id="back">← Start</button><div class="prog"><i style="width:${Math.round((Math.min(di, deckLen) / deckLen) * 100)}%"></i></div><span class="muted" style="font-size:13px">${Math.min(di + 1, deck.length)} / ${deck.length}</span></div>
    <article class="card">
      <div class="row" style="justify-content:space-between"><span class="label">${esc(TOPICS[c.topic])}</span><span class="boxes" title="Lernstufe">${boxes}</span></div>
      <div class="q">${esc(c.q)}</div>
      ${open ? `<div class="a">${esc(c.a)}</div><div class="tr"><b>TR</b><span>${esc(c.tr)}</span></div>` : ""}
    </article>
    <div class="btns">${open
      ? `<button class="btn no" data-r="0">Nicht gewusst<small>kommt gleich wieder</small></button><button class="btn mid" data-r="1">Unsicher<small>+1 XP</small></button><button class="btn ok" data-r="2">Gewusst<small>+3 XP</small></button>`

  document.getElementById("back").onclick = home;
  if (!open) document.getElementById("reveal").onclick = () => showCard(true);
  else view.querySelectorAll("[data-r]").forEach(b => b.onclick = () => rateCard(c, +b.dataset.r));
}
function rateCard(c, r) {
  const st = { ...cardState(c.id) };
  if (r === 0) { st.box = 1; st.due = Date.now(); st.wrong++; deck.push(c); }
  else if (r === 1) { st.box = Math.max(1, st.box); st.due = Date.now() + 10 * 60000; st.right++; addXP(1); if (deck.indexOf(c, di + 1) < 0 && deck.length < deckLen + 8) deck.push(c); }
  else { st.box = Math.min(5, st.box + 1); st.due = Date.now() + INTERVAL_DAYS[st.box] * 86400000 - (INTERVAL_DAYS[st.box] >= 1 ? 7200000 : 0); st.right++; addXP(3); }

}
function finishCards() {

let Q = [], qi = 0, score = 0, combo = 0, roundXP = 0, roundName = "";
function startQuiz(items, name) { Q = items; qi = 0; score = 0; combo = 0; roundXP = 0; roundName = name; showQ(); }
function showQ() {
  if (qi >= Q.length) return finishQuiz();
  const q = Q[qi];
  const keys = q.type === "wf" ? ["W", "F"] : ["a", "b", "c", "d"];
  const order = q.type === "wf" ? [0, 1] : shuffle(q.opts.map((_, i) => i));
  view.innerHTML = `

function answer(q, i) {
  const ok = i === q.ans;
  view.querySelectorAll(".opt").forEach(b => { b.disabled = true; const k = +b.dataset.i; if (k === q.ans) b.classList.add("right"); else if (k === i) b.classList.add("wrong"); });
  const st = S.quiz[q.id] || { right: 0, wrong: 0, last: null };
  if (ok) { st.right++; st.last = 1; score++; combo++; let gain = 10; if (combo % 3 === 0) gain += 5; roundXP += gain; addXP(gain); }
  else { st.wrong++; st.last = 0; combo = 0; }
  S.quiz[q.id] = st; touch();
  document.getElementById("combo").textContent = combo >= 2 ? "Combo ×" + combo : "";
  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok ? "right" : "wrong"}">
      <div class="h">${ok ? (combo && combo % 3 === 0 ? "Richtig! Combo-Bonus +5" : "Richtig!") : "Leider falsch – richtig ist: " + esc(q.opts[q.ans])}</div>

      <div class="tr"><b>TR</b><span>${esc(q.tr)}</span></div>

    <div class="btns"><button class="btn main" id="next">${qi + 1 < Q.length ? "Weiter" : "Auswertung"}</button></div>`;

}
function finishQuiz() {
  const pct = Q.length ? Math.round((score / Q.length) * 100) : 0;

  touch();
  const msg = pct >= 80 ? "Stark. So sieht eine 1,7 aus." : pct >= 50 ? "Solide. Die Fehler landen in deinen Schwachstellen." : "Kein Problem – genau dafür trainierst du. Lies die Erklärungen noch einmal.";

}

function burst() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  const w = cv.width = innerWidth * devicePixelRatio, h = cv.height = innerHeight * devicePixelRatio;
  const cols = ["#c9a25e", "#e9cf98", "#a47c3b", "#f2ece0", "#85662b"];
  const P = Array.from({ length: 110 }, () => ({ x: w / 2, y: h * 0.35, vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (Math.random() * -14 - 4) * devicePixelRatio, s: (4 + Math.random() * 5) * devicePixelRatio, r: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
  let t = 0;
  (function step() {
    ctx.clearRect(0, 0, w, h); t++;
    P.forEach(p => { p.vy += .45 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.r += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t < 110) requestAnimationFrame(step); else ctx.clearRect(0, 0, w, h);
  })();
}

const STAGES = ["Geführt", "Ohne Hilfe", "Klausur"];
const STAGE_XP = [10, 20, 30];

/* ───────── Schreib-Trainer · Bewertung ───────── */
const norm = s => (s || "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, " ").trim();
const hit = (t, kw) => { const k = norm(kw); return k.length <= 3 ? (" " + t + " ").includes(" " + k + " ") : t.includes(k); };
const q4 = x => Math.round(x * 4) / 4;
const fmt = x => String(q4(x)).replace(".", ",");
function quickScore(task, answers, free) {
  const all = norm(free ? answers[0] : answers.join(" "));
  return task.slots.map((sl, i) => {
    const t = free ? all : norm(answers[i]);
    const ok = sl.kw.map(g => g.some(k => hit(t, k)));
    return { pts: q4(sl.pts * ok.filter(Boolean).length / sl.kw.length), max: sl.pts, core: sl.core, missing: sl.kw.filter((g, j) => !ok[j]).map(g => g[0]) };
  });
}
function totals(crit) {
  const sum = f => crit.filter(f).reduce((a, c) => a + c.pts, 0), max = f => crit.filter(f).reduce((a, c) => a + c.max, 0);
  const core = sum(c => c.core), coreMax = max(c => c.core), bonus = sum(c => !c.core), bonusMax = max(c => !c.core);
  return { core, coreMax, bonus, bonusMax, pct: coreMax ? Math.round((core / coreMax) * 100) : 0 };
}

  const answer = free ? answers[0] : task.slots.map((sl, i) => `[${i + 1}. ${sl.label}]\n${answers[i] || "(leer)"}`).join("\n\n");
  return `Du korrigierst eine Antwort für die Klausur „Einführung in das Zivilrecht für Wirtschaftswissenschaftler“ (Uni Göttingen). Der Student lernt Deutsch als Fremdsprache und ist Anfänger. Sei streng wie ein Prüfer, aber fair und ermutigend.

AUFGABE: ${task.q} (${task.exam} ${task.exam === 1 ? "Punkt" : "Punkte"})
${task.ctx ? "SACHVERHALT: " + task.ctx + "\n" : ""}MODUS: ${free ? "Klausur-Modus – freie Antwort ohne Struktur-Hilfe. Ordne den Inhalt selbst den Kriterien zu." : "Geführt – die Antwort ist nach Kriterien gegliedert."}

BEWERTUNGSRASTER (je Kriterium 0 bis max in Schritten von 0,25; „Kern“ zählt für die Klausurpunkte, „Bonus“ zeigt Verständnis):
${raster}

REGELN DES PRÜFERS: abstrakt antworten und mit Paragrafen belegen, wo möglich. Bei Fallaufgaben Gutachtenstil: Obersatz im Konjunktiv („könnte“, „müsste“), erst Definition, dann Subsumtion mit den Fakten des Sachverhalts, Ergebnis am Ende mit „folglich“ / „somit“; Urteilsstil (Ergebnis zuerst) kostet Punkte. Sinngemäß richtige Formulierungen zählen voll. Sprachfehler kosten keine Punkte, solange der Inhalt klar ist.

ANTWORT DES STUDENTEN:
${answer}

Antworte nur mit JSON in genau dieser Form:
{"kriterien":[{"nr":1,"punkte":0.5,"kommentar":"1–2 kurze Sätze in einfachem Deutsch"}],"staerken":["was gut war"],"fehlt":["fehlender Fachbegriff oder Gedanke"],"tipps":["höchstens 3 konkrete Tipps, wie man es in der Klausur besser schreibt"],"tipps_tr":["dieselben Tipps auf Türkisch"],"verbessert":"die Antwort des Studenten als klausurreife Version, nah an seinen Worten, höchstens 130 Wörter","sprache":["höchstens 2 wichtige Sprachfehler mit Korrektur, sonst leer"]}`;
}
const arr = x => Array.isArray(x) ? x.map(String).filter(Boolean).slice(0, 5) : [];
async function aiGrade(task, stage, answers, signal) {
  const r = await sampleFn.json(buildPrompt(task, stage, answers), { signal, modelTier: "default" });
  const ks = Array.isArray(r && r.kriterien) ? r.kriterien : [];
  const crit = task.slots.map((sl, i) => {
    const k = ks.find(x => Number(x && x.nr) === i + 1) || ks[i] || {};
    let p = Number(k.punkte); if (!isFinite(p)) p = 0;
    return { pts: Math.max(0, Math.min(sl.pts, q4(p))), max: sl.pts, core: sl.core, comment: String(k.kommentar || "") };
  });
  return { crit, staerken: arr(r.staerken), fehlt: arr(r.fehlt), tipps: arr(r.tipps), tipps_tr: arr(r.tipps_tr), verbessert: String(r.verbessert || ""), sprache: arr(r.sprache) };
}

/* ───────── Schreib-Trainer · Zustand ───────── */
const wState = id => (S.write && S.write[id]) || { best: [0, 0, 0], n: 0, mastered: false };
const unlocked = (id, stage) => stage === 1 || wState(id).best[stage - 2] >= 70;
const masteredCount = () => WRITE.filter(t => wState(t.id).mastered).length;
function recordWrite(task, stage, pct, src, text) {
  if (!S.write) S.write = {};
  const st = JSON.parse(JSON.stringify(wState(task.id)));
  const oldXP = Math.round(st.best[stage - 1] / 100 * STAGE_XP[stage - 1]);
  st.best[stage - 1] = Math.max(st.best[stage - 1], pct);
  const gain = Math.max(0, Math.round(st.best[stage - 1] / 100 * STAGE_XP[stage - 1]) - oldXP);
  let mastery = false;
  if (stage === 3 && pct >= 80 && !st.mastered) { st.mastered = true; mastery = true; }
  st.n++; st.last = { s: stage, pct, src, d: today(), text: text.slice(0, 2000) };
  S.write[task.id] = st;
  addXP(gain + (mastery ? 25 : 0));
  touch();
  if (mastery) { burst(); setTimeout(() => popText("Gemeistert!"), 950); }
  return { gain, mastery };
}
const draftKey = (id, stage) => `drill-draft-${id}-${stage}`;
function loadDraft(id, stage) { try { return JSON.parse(localStorage.getItem(draftKey(id, stage)) || "null"); } catch { return null; } }
function saveDraft(id, stage, a) { try { localStorage.setItem(draftKey(id, stage), JSON.stringify(a)); } catch {} }
function clearDraft(id, stage) { try { localStorage.removeItem(draftKey(id, stage)); } catch {} }

/* ───────── Schreib-Trainer · Bildschirme ───────── */
function writeList() {
  const row = t => {
    const st = wState(t.id);
    const pips = [0, 1, 2].map(k => `<i class="${st.best[k] >= (k === 2 ? 80 : 70) ? "on" : ""}" title="Stufe ${k + 1}"></i>`).join("");
    const best = Math.max(...st.best);
    return `<button class="wrow" data-w="${t.id}"><div style="min-width:0"><div class="t">${esc(t.q)}</div><div class="m">${t.exam} ${t.exam === 1 ? "Punkt" : "Punkte"} · ${st.n ? "bestes Ergebnis " + best + " %" : "noch nicht geschrieben"}</div></div><div class="pips">${st.mastered ? '<span class="badge">gemeistert</span>' : pips}</div></button>`;
  };
  view.innerHTML = `
    <div class="bar2"><button class="back" id="back">← Start</button></div>
    <section class="stage">
      <span class="label">Schreib-Trainer · ${masteredCount()} / ${WRITE.length} gemeistert</span>
      <h1>Schreib es <em>selbst</em>.</h1>
      <p style="color:var(--stage-muted);margin:10px 0 0;font-size:15px">Jede Aufgabe hat 3 Stufen: <b style="color:var(--stage-ink)">Geführt</b> (Kästen mit Hinweisen) → <b style="color:var(--stage-ink)">Ohne Hilfe</b> (nur Kästen) → <b style="color:var(--stage-ink)">Klausur</b> (ein leeres Feld, aus dem Kopf). Ab 70 % öffnet sich die nächste Stufe, ab 80 % in der Klausur-Stufe ist die Aufgabe gemeistert.</p>
      <div class="tr"><b>TR</b><span style="color:var(--stage-muted)">Cevabını kendin yaz. Önce ipuçlu kutular, sonra ipucusuz, en son sınav gibi boş sayfa. Claude cevabını puanlar ve sınavda nasıl daha iyi yazacağını söyler.</span></div>
    </section>
    <div class="wgrp"><span class="label">Frageteil · Einzelfragen</span>${WRITE.filter(t => t.group === "frage").map(row).join("")}</div>
    <div class="wgrp"><span class="label">Gutachten-Bausteine · Fall</span>${WRITE.filter(t => t.group === "gutachten").map(row).join("")}</div>`;
  document.getElementById("back").onclick = home;
  view.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
    const t = WRITE.find(x => x.id === b.dataset.w), st = wState(t.id);
    const stage = st.mastered ? 3 : unlocked(t.id, 3) ? 3 : unlocked(t.id, 2) ? 2 : 1;
    writeTask(t, stage);
  });
}

let lastField = null, aiCtl = null;
function writeTask(task, stage) {
  if (aiCtl) { aiCtl.abort(); aiCtl = null; }
  const free = stage === 3;
  const draft = loadDraft(task.id, stage) || [];
  const tabs = STAGES.map((n, k) => `<button class="stg${k + 1 === stage ? " on" : ""}" data-s="${k + 1}" ${unlocked(task.id, k + 1) ? "" : "disabled"}>${k + 1} · ${n}${unlocked(task.id, k + 1) ? "" : " · ab 70 %"}</button>`).join("");
  const slots = free
    ? `<div class="free"><label class="label" for="wf-${task.id}">Deine Antwort – wie in der Klausur</label><textarea id="wf-${task.id}" data-i="0" spellcheck="false" placeholder="Schreib deine vollständige Antwort aus dem Kopf …">${esc(draft[0] || "")}</textarea></div>`
    : task.slots.map((sl, i) => `
      <div class="slot">
        <div class="sh"><b>${i + 1}. ${esc(sl.label)}</b><span class="xp" style="color:var(--gold-ink)">${fmt(sl.pts)} P.${sl.core ? "" : " · Bonus"}</span></div>
        ${stage === 1 ? `<div class="hint">${esc(sl.hint)}</div><div class="tr" style="margin-top:4px"><b>TR</b><span>${esc(sl.tr)}</span></div>` : ""}
        <textarea id="w-${task.id}-${i}" data-i="${i}" spellcheck="false" aria-label="${esc(sl.label)}">${esc(draft[i] || "")}</textarea>
      </div>`).join("");
  view.innerHTML = `
    <div class="bar2"><button class="back" id="back">← Alle Aufgaben</button></div>
    <div class="stages">${tabs}</div>
    <article class="card">
      <span class="label">${task.group === "frage" ? "Einzelfrage" : "Gutachten-Baustein"} · ${task.exam} ${task.exam === 1 ? "Punkt" : "Punkte"}</span>
      ${task.ctx ? `<div class="case">${esc(task.ctx)}</div>` : ""}
      <div class="q">${esc(task.q)}</div>
      <div class="tr"><b>TR</b><span>${esc(task.tr)}</span></div>
      ${task.note && stage < 3 ? `<p class="note">${esc(task.note)}</p>` : ""}
      ${free ? `<p class="note">Klausur-Modus: keine Kästen, keine Hinweise. ${task.group === "gutachten" ? "Schreib im Gutachtenstil: Obersatz → Definition → Subsumtion → Ergebnis." : "Definition + Paragraf + kurze Erklärung."}</p>` : ""}
      ${slots}
      <div class="kbd" aria-label="Sonderzeichen"><span>Einfügen:</span>${["ä", "ö", "ü", "Ä", "Ö", "Ü", "ß", "§", "„", "“"].map(c => `<button type="button" data-ch="${c}">${c}</button>`).join("")}</div>
      <div class="btns" style="grid-template-columns:1fr"><button class="btn main" id="submit">Abgeben &amp; korrigieren</button></div>
      <div id="wres"></div>
    </article>`;
  document.getElementById("back").onclick = writeList;
  view.querySelectorAll(".stg").forEach(b => b.onclick = () => { if (!b.disabled) writeTask(task, +b.dataset.s); });
  const fields = [...view.querySelectorAll("textarea")];
  let t;
  fields.forEach(f => {
    f.onfocus = () => { lastField = f; };
    f.oninput = () => { clearTimeout(t); t = setTimeout(() => saveDraft(task.id, stage, fields.map(x => x.value)), 400); };
  });
  lastField = fields[0];
  view.querySelectorAll("[data-ch]").forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => {
      const f = lastField || fields[0]; if (!f) return;
      const a = f.selectionStart ?? f.value.length, z = f.selectionEnd ?? a;
      f.value = f.value.slice(0, a) + b.dataset.ch + f.value.slice(z);
      f.focus(); f.selectionStart = f.selectionEnd = a + b.dataset.ch.length;
      f.dispatchEvent(new Event("input"));
    };
  });
  document.getElementById("submit").onclick = () => submitWrite(task, stage, fields.map(f => f.value.trim()));
}

async function submitWrite(task, stage, answers) {
  const res = document.getElementById("wres");
  if (!answers.some(a => a.length >= 3)) { res.innerHTML = `<p class="note" style="color:var(--no)">Schreib zuerst deine Antwort – auch wenn sie nicht perfekt ist.</p>`; return; }
  const free = stage === 3;
  const quick = quickScore(task, answers, free);
  const text = free ? answers[0] : task.slots.map((sl, i) => `${sl.label}: ${answers[i]}`).join("\n");
  document.getElementById("submit").disabled = true;
  renderWriteResult(task, stage, { crit: quick }, "quick", sampleFn ? "loading" : "off");
  if (!sampleFn) { finishWrite(task, stage, totals(quick).pct, "quick", text); return; }
  aiCtl = new AbortController();
  try {
    const ai = await aiGrade(task, stage, answers, aiCtl.signal);
    aiCtl = null;
    renderWriteResult(task, stage, ai, "ai", "done");
    finishWrite(task, stage, totals(ai.crit).pct, "ai", text);
  } catch (e) {
    aiCtl = null;
    const code = e && e.code;
    if (code === "cancelled") { renderWriteResult(task, stage, { crit: quick }, "quick", "stopped"); finishWrite(task, stage, totals(quick).pct, "quick", text); return; }
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) sampleFn = null;
    const msg = code === "rate_limited" ? "Gerade zu viele Anfragen – versuch es in ein paar Minuten nochmal."
      : code === "session_expired" ? "Bitte melde dich bei Claude neu an."
      : sampleFn ? "Claude konnte gerade nicht antworten." : "Die Claude-Bewertung ist hier nicht verfügbar – der Schnell-Check zählt.";
    renderWriteResult(task, stage, { crit: quick }, "quick", "error", msg, () => submitWrite(task, stage, answers));
    finishWrite(task, stage, totals(quick).pct, "quick", text);
  }
}
function finishWrite(task, stage, pct, src, text) {
  clearDraft(task.id, stage);
  const r = recordWrite(task, stage, pct, src, text);
  const box = document.getElementById("wnext");
  if (!box) return;
  const next = stage < 3 && unlocked(task.id, stage + 1);
  box.innerHTML = `
    <p class="note">${r.mastery ? "Aufgabe gemeistert – stark!" : stage === 3 && pct >= 80 ? "Wieder über 80 % – das sitzt." : next ? `Stufe ${stage + 1} ist offen.` : stage < 3 ? `Für Stufe ${stage + 1} brauchst du 70 % in dieser Stufe.` : "Ziel: 80 % im Klausur-Modus."}${r.gain ? ` · +${r.gain} XP` : ""}</p>
    <div class="btns" style="grid-template-columns:repeat(${next ? 3 : 2},minmax(0,1fr))">
      <button class="btn" id="again">Nochmal schreiben</button>
      ${next ? `<button class="btn main" style="grid-column:auto" id="nextStage">Stufe ${stage + 1} →</button>` : ""}
      <button class="btn" id="toList">Alle Aufgaben</button>
    </div>`;
  document.getElementById("again").onclick = () => writeTask(task, stage);
  document.getElementById("toList").onclick = writeList;
  if (next) document.getElementById("nextStage").onclick = () => writeTask(task, stage + 1);
}
function renderWriteResult(task, stage, data, src, aiState, msg, retry) {
  const tt = totals(data.crit);
  const C = 2 * Math.PI * 26;
  const crit = data.crit.map((c, i) => {
    const sl = task.slots[i], cls = c.pts >= c.max ? "full" : c.pts > 0 ? "part" : "zero";
    const body = src === "ai"
      ? (c.comment ? `<p>${esc(c.comment)}</p>` : "")
      : (c.missing.length ? `<div>${c.missing.map(m => `<span class="miss">fehlt: ${esc(m)}</span>`).join("")}</div>` : `<p>Alle Schlüsselbegriffe gefunden.</p>`);
    return `<div class="crit"><div class="ch"><b>${i + 1}. ${esc(sl.label)}${sl.core ? "" : ' <span class="muted" style="font-weight:400">· Bonus</span>'}</b><span class="pts ${cls}">${fmt(c.pts)} / ${fmt(c.max)}</span></div>${body}<details class="mu"><summary>Musterlösung</summary><div>${esc(sl.model)}</div></details></div>`;
  }).join("");
  const ai = src === "ai" ? data : null;
  const list = (h, xs) => xs && xs.length ? `<span class="h5">${h}</span><ul class="tips">${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const status = aiState === "loading"
    ? `<div class="ailine"><span class="dots"><i></i><i></i><i></i></span><span>Claude korrigiert deine Antwort … (bis zu einer Minute)</span><button class="back" id="stopAi">Stopp</button></div>`
    : aiState === "error" ? `<div class="ailine"><span>${esc(msg || "")}</span>${retry && sampleFn ? '<button class="back" id="retryAi">Nochmal versuchen</button>' : ""}</div>`
    : aiState === "off" ? `<div class="ailine"><span>Schnell-Check nach Schlüsselbegriffen. Die ausführliche Claude-Bewertung gibt es in der Claude-App.</span></div>`
    : aiState === "stopped" ? `<div class="ailine"><span>Claude-Bewertung gestoppt – der Schnell-Check zählt.</span></div>` : "";
  document.getElementById("wres").innerHTML = `
    <div style="margin-top:20px;border-top:1px dashed var(--gold);padding-top:16px">
      <div class="score">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - tt.pct / 100)}" transform="rotate(-90 32 32)"/></svg>
        <div><div class="big2">${fmt(tt.core)}<span> / ${fmt(tt.coreMax)} P.</span></div>
        <div class="row" style="margin-top:4px"><span class="src${src === "ai" ? " ai" : ""}">${src === "ai" ? "Claude-Bewertung" : "Schnell-Check"}</span><span class="muted" style="font-size:13.5px">${tt.pct} % der Klausurpunkte${tt.bonusMax ? ` · Bonus ${fmt(tt.bonus)} / ${fmt(tt.bonusMax)}` : ""}</span></div></div>
      </div>
      ${status}
      <span class="h5">Pro Kriterium</span>
      <div>${crit}</div>
      ${ai && ai.verbessert ? `<span class="h5">So schreibst du es in der Klausur</span><div class="improved">${esc(ai.verbessert)}</div>` : ""}
      ${ai ? list("Das war gut", ai.staerken) + list("Das fehlt noch", ai.fehlt) + list("Tipps für die Klausur", ai.tipps) : ""}
      ${ai && ai.tipps_tr.length ? `<div class="tr"><b>TR</b><span>${ai.tipps_tr.map(esc).join(" · ")}</span></div>` : ""}
      ${ai ? list("Sprache", ai.sprache) : ""}
      <div id="wnext"></div>
    </div>`;
  const stop = document.getElementById("stopAi"); if (stop) stop.onclick = () => aiCtl && aiCtl.abort();
  const re = document.getElementById("retryAi"); if (re) re.onclick = retry;
  document.getElementById("wres").scrollIntoView({ behavior: "smooth", block: "start" });
}
let sampleFn = null;

/* ───────── Start & Sync ───────── */
const view = document.getElementById("view");
const local = loadLocal();
if (local && local.v === 1) S = Object.assign(fresh(), local);
renderTop(); home();
setSync(false, "Fortschritt nur auf diesem Gerät");

if (window.claude && window.claude.use) window.claude.use("sample").then(f => { sampleFn = f || null; }).catch(() => {});
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [dbNs, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!dbNs || !uid) return;
    db = dbNs; docRef = db.doc("progress/" + uid);
    const snap = await docRef.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.v === 1 && (remote.updatedAt || 0) >= (S.updatedAt || 0)) {
      S = Object.assign(fresh(), JSON.parse(JSON.stringify(remote))); saveLocal(); renderTop(); home(); setSync(true);
    } else if (S.updatedAt) { dirty = true; await flush(); }
    else setSync(true, "Bereit – Fortschritt wird in deinem Konto gespeichert");
  } catch (e) { setSync(false); }
})();
})();
</script>
